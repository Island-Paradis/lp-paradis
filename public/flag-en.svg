<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40" role="img" aria-hidden="true">
  <!--
    Bandeira do Reino Unido para `en`.

    ESCOLHA PROVISÓRIA, a confirmar pelo utilizador. Não existe bandeira neutra
    para um idioma — o Reino Unido é a convenção mais comum para "English", os
    Estados Unidos é a outra, e nenhuma das duas representa o idioma em si.
    Trocar é substituir este ficheiro: nada no código depende de qual bandeira
    está aqui, só do caminho `/flag-en.svg`.

    Geometria do Union Jack: campo azul, saltire branco (largura 6) com o
    vermelho por dentro (largura 4) recortado em contra-rotação pelo clipPath, e
    a cruz de São Jorge branca (10) com vermelho (6) por cima.
  -->
  <defs>
    <clipPath id="uk-saltire">
      <path d="M30 20 L60 20 L60 40 Z M30 20 L30 40 L0 40 Z M30 20 L0 20 L0 0 Z M30 20 L30 0 L60 0 Z"/>
    </clipPath>
  </defs>
  <rect width="60" height="40" fill="#012169"/>
  <path d="M0 0 L60 40 M60 0 L0 40" stroke="#ffffff" stroke-width="8"/>
  <path
    d="M0 0 L60 40 M60 0 L0 40"
    stroke="#c8102e"
    stroke-width="5"
    clip-path="url(#uk-saltire)"
  />
  <path d="M30 0 L30 40 M0 20 L60 20" stroke="#ffffff" stroke-width="13"/>
  <path d="M30 0 L30 40 M0 20 L60 20" stroke="#c8102e" stroke-width="8"/>
</svg>
